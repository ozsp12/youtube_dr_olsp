name: Split organization dataset

on:
  push:
    branches:
      - split-organization-csv
    paths:
      - .github/workflows/split_organization.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: split-organization-csv
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas openpyxl
      - name: Split organization.xlsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          source = Path('data/organization.xlsx')
          raw = pd.read_excel(source, header=None, dtype=str, keep_default_na=False)

          header_row = None
          for i, row in raw.iterrows():
              values = {str(v).strip() for v in row.tolist()}
              if 'Tipo' in values and 'VideoID' in values:
                  header_row = i
                  break

          if header_row is None:
              raise SystemExit("Could not locate the header row containing 'Tipo' and 'VideoID'")

          df = pd.read_excel(source, header=header_row, dtype=str, keep_default_na=False)
          df.columns = [str(c).strip() for c in df.columns]
          tipo = df['Tipo'].astype(str).str.strip().str.lower()

          nonempty = tipo.ne('')
          df = df[nonempty].copy()
          tipo = tipo[nonempty]

          invalid = sorted(set(tipo) - {'video', 'short'})
          if invalid:
              raise SystemExit(f'Rows with unsupported Tipo values: {invalid}')

          videos = df[tipo.eq('video')].copy()
          shorts = df[tipo.eq('short')].copy()

          videos.to_csv('data/videos.csv', index=False, encoding='utf-8')
          shorts.to_csv('data/shorts.csv', index=False, encoding='utf-8')

          print(f'header_row={header_row} videos={len(videos)} shorts={len(shorts)} total={len(df)}')
          if len(videos) != 50 or len(shorts) != 50:
              raise SystemExit('Unexpected record count')
          PY
      - name: Replace source workbook with CSV files
        run: |
          rm data/organization.xlsx
          rm .github/workflows/split_organization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split organization dataset into videos and shorts CSVs"
          git push origin HEAD:split-organization-csv
